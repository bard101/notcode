spring:
  application:
    name: notcode-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/notcode
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      strict-json-schema: true
      response-format: json_object
      max-tokens: 8192
      timeout: 300s
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      max-tokens: 8192
      timeout: 300s
      log-requests: true
      log-responses: true
# Pexels 图片搜索 API（免费注册：https://www.pexels.com/api/）
pexels:
  api-key: ${PEXELS_API_KEY:}
# Firecrawl 网页抓取 API（https://www.firecrawl.dev/）
firecrawl:
  api-key: ${FIRECRAWL_API_KEY:}
  base-url: https://api.firecrawl.dev/v1
